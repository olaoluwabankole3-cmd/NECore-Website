name: Website review checks

on:
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - 'api/**'
      - '.github/workflows/website-review.yml'
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - 'api/**'
      - '.github/workflows/website-review.yml'

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all website JavaScript
        run: |
          node --check assets/app.js
          node --check assets/verification-hero.js
          node --check assets/hero-entrance.js
          node --check api/contact.js
      - name: Validate local image, script and stylesheet references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('.')
          pages=sorted(root.glob('*.html'))
          errors=[]
          for page in pages:
              html=page.read_text()
              for url in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html):
                  if not (url.startswith('assets/') or url.startswith('api/')):continue
                  path=url.split('?',1)[0].split('#',1)[0]
                  if not (root/path).is_file():
                      errors.append(f'{page}: missing {path}')
          homepage=(root/'index.html').read_text()
          for path in ('assets/hero-entrance.js','assets/hero-entrance.css','assets/toon-base-clean-v6.webp'):
              if path not in homepage:
                  errors.append(f'Homepage does not reference {path}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated asset references in {len(pages)} HTML pages.')
          PY

  portrait-matte-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install local image processing dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
      - name: Generate and inspect portrait alpha matte
        run: python3 tools/refine-hero-matte.py
