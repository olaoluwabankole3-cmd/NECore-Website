name: Website review checks

on:
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - 'api/**'
      - 'tests/phase-2-browser.cjs'
      - 'tests/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'vercel.json'
      - '.github/workflows/website-review.yml'
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - 'api/**'
      - 'tests/phase-2-browser.cjs'
      - 'tests/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'vercel.json'
      - '.github/workflows/website-review.yml'

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all website JavaScript
        run: |
          node --check assets/app.js
          node --check assets/verification-hero.js
          node --check assets/hero-entrance.js
          node --check api/contact.js
      - name: Validate public contract examples and disclosures
        run: |
          python3 tests/phase-3-content.py
          python3 tests/platform-access.py
      - name: Validate SEO and disabled contact
        run: |
          python3 tests/phase-4-seo.py
          node --test tests/contact-disabled.test.cjs
      - name: Validate local image, script and stylesheet references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('.')
          pages=sorted(root.glob('*.html'))
          errors=[]
          for page in pages:
              html=page.read_text()
              for url in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html):
                  if not (url.startswith('assets/') or url.startswith('api/')):continue
                  path=url.split('?',1)[0].split('#',1)[0]
                  if not (root/path).is_file():
                      errors.append(f'{page}: missing {path}')
          homepage=(root/'index.html').read_text()
          for path in ('assets/hero-entrance.js','assets/hero-motion.css','assets/toon-base-clean-v6.webp'):
              if path not in homepage:
                  errors.append(f'Homepage does not reference {path}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated asset references in {len(pages)} HTML pages.')
          PY

  portrait-matte-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install local image processing dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
      - name: Generate and inspect portrait alpha matte
        run: python3 tools/refine-hero-matte.py

  responsive-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site and run responsive checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/necore-site.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          node tests/phase-2-browser.cjs

  release-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 axe-core@4.14.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test keyboard access, layouts, routing and accessibility
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: |
          python3 tests/phase-4-server.py > /tmp/necore-phase4.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/phase-4-browser.cjs
      - name: Retain accessibility report
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-accessibility
          path: qa-results/axe.json
          if-no-files-found: ignore

  lighthouse-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse
        run: npm install --no-save --package-lock=false --ignore-scripts lighthouse@12.8.2
      - name: Measure representative public pages
        run: |
          python3 tests/phase-4-server.py > /tmp/necore-lighthouse.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          mkdir -p qa-results
          for path in index products developers security; do
            url="http://127.0.0.1:4173/$path.html"
            npx --no-install lighthouse "$url" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="qa-results/$path.json" --quiet
          done
          node -e 'for (const p of ["index","products","developers","security"]) {const r=require("./qa-results/"+p+".json"); console.log(p,JSON.stringify(Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)]))));}'
      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-lighthouse
          path: qa-results/*.json
          if-no-files-found: ignore
